[package]
name = "tdoc"
version = "0.12.1"
edition = "2021"
description = "Library and CLI for reading, rendering, and converting text documents across Markdown, HTML, Gemini, and FTML"
authors = ["Rob Lillack <rob@lillack.net>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/roblillack/tdoc"
exclude = [
    "tests/",
    "screenshot.png",
    ".github/",
    ".gitignore",
]

[lib]
name = "tdoc"
path = "src/lib.rs"

[[bin]]
name = "tdoc"
path = "src/bin/tdoc/main.rs"

[features]
default = ["remote"]
remote = ["dep:reqwest", "dep:rustls", "dep:rustls-native-certs", "dep:webpki-roots", "dep:native-tls"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
regex = "1.10"
thiserror = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["blocking"], optional = true }
url = "2.4"
crossterm = "0.27"
atty = "0.2"
pulldown-cmark = "0.13"
html-escape = "0.2"
indexmap = { version = "2.7", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
once_cell = "1.19"
unicode-width = "0.1"

# TLS backend selection.
#
# Windows uses native-tls, which resolves to SChannel and needs no C toolchain.
# rustls pulls in ring, and ring's build script requires Clang when targeting
# aarch64-pc-windows-msvc, which is not part of a stock MSVC install.
# Every other platform keeps rustls.
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.11", default-features = false, features = ["native-tls"], optional = true }
native-tls = { version = "0.2", optional = true }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"], optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "0.26", optional = true }

[dev-dependencies]
assert_matches = "1.5"
insta = "1.40"
